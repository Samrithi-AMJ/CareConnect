<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareConnect — Connecting Care Beyond the Hospital</title>
<meta name="description" content="CareConnect is a multilingual, accessibility-first digital healthcare platform for patients, families and caregivers.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<div id="app"></div>
<div id="toast-region" aria-live="polite" role="status"></div>

<!--
  Loaded as a module so it can `import` @supabase/supabase-js and the
  service files under src/services/. It exposes what main.js needs on
  `window` — see src/app-init.js for why, and why the load order here
  doesn't actually matter (module scripts are always deferred).
-->
<script type="module" src="/src/app-init.js"></script>

<!--
  Loaded as a plain (non-module) script on purpose: main.js declares its
  functions at the top level so they attach to `window`, which is what the
  inline onclick="..." handlers rendered into the page rely on. Do not add
  type="module" here without also refactoring those handlers.
-->
<script type="module" src="/public/main.js"></script>
</body>
</html>
